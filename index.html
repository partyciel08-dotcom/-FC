<DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>랜덤 영상</title>

<style>
body {
  margin: 0;
  background: black;
  font-family: sans-serif;
}

/* 🎬 시작 화면 */
.start-screen {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100vh;
}

.start-screen img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ▶️ 시작 버튼 */
.start-btn {
  position: absolute;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  padding: 15px 30px;
  font-size: 18px;
  border: none;
  border-radius: 50px;
  background: red;
  color: white;
  cursor: pointer;
}

/* 🎥 영상 */
video {
  width: 100%;
  height: 100vh;
  object-fit: cover;
  display: none;
}
</style>
</head>

<body>

<!-- 🎬 썸네일 화면 -->
<div class="start-screen" id="startScreen">
  <img src="https://via.placeholder.com/1080x1920?text=썸네일+이미지" alt="썸네일">
  <button class="start-btn" onclick="startVideo()">영상통화 하러가기</button>
</div>

<!-- 🎥 영상 -->
<video id="video" playsinline></video>

<script>
// 👉 네이버 폼 링크
const formLink = "https://naver.me/G8fZCBl4";

// 👉 영상 리스트 (여기에 계속 추가하면 됨)
const videos = [
  "https://res.cloudinary.com/dkxltupng/video/upload/f_mp4,q_auto/v1776230951/%EC%A1%B0%EB%B9%88%EC%88%98%EC%A0%95%EB%B3%B8_zuocpj.mp4",
  "https://res.cloudinary.com/dkxltupng/video/upload/f_mp4,q_auto/v1776135608/%ED%9D%AC%EC%88%98%EC%84%A0%EC%88%982_pa1wfd.mp4",

  // 🔽👇 여기부터 영상 추가하면 됨
  "https://res.cloudinary.com/dkxltupng/video/upload/f_mp4,q_auto/v1776135734/%EC%B0%BD%EB%AC%B4%EC%84%A0%EC%88%982_iwko3j.mp4",
  "https://res.cloudinary.com/dkxltupng/video/upload/f_mp4,q_auto/v1776135772/%EC%A7%80%ED%9B%88%EC%84%A0%EC%88%982_mvmfwi.mp4",
  "https://res.cloudinary.com/dkxltupng/video/upload/f_mp4,q_auto/v1776135809/%EA%B2%BD%EB%AF%BC%EC%84%A0%EC%88%982_bebifq.mp4"
];

const video = document.getElementById("video");

// 🎲 랜덤 선택
const randomVideo = videos[Math.floor(Math.random() * videos.length)];

// ▶️ 시작 버튼 클릭
function startVideo(){
  document.getElementById("startScreen").style.display = "none";
  video.style.display = "block";

  video.src = randomVideo;

  video.play().catch(() => {
    video.muted = true;
    video.play();
  });
}

// 🔥 영상 끝나면 폼 이동
video.addEventListener("ended", () => {
  window.location.href = formLink;
});
</script>
  
</body>
</html>
