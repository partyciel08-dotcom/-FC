<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>랜덤 영상통화</title>

<style>
body {
  margin: 0;
  background: black;
  font-family: sans-serif;
}

/* 🎬 시작 화면 (중앙 정렬) */
.start-screen {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center; /* 👈 완전 중앙 */
}

/* ▶️ 시작 버튼 */
.start-btn {
  padding: 18px 36px;
  font-size: 20px;
  border: none;
  border-radius: 50px;
  background: red;
  color: white;
  cursor: pointer;
}

/* 🎥 영상 */
video {
  width: 100%;
  height: 100vh;
  object-fit: cover;
  display: none;
}

/* 🔴 종료 버튼 (기본 스타일) */
.end-btn {
  position: absolute;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  width: 80px;
  height: 80px;
  background: red;
  border-radius: 50%;
  border: none;
  color: white;
  font-size: 14px;
  display: none;
}
</style>
</head>

<body>

<!-- 🎬 시작 화면 -->
<div class="start-screen" id="startScreen">
  <button class="start-btn" onclick="startVideo()">영상통화 하러가기</button>
</div>

<!-- 🎥 영상 -->
<video id="video" playsinline></video>

<!-- 🔴 종료 버튼 -->
<button class="end-btn" id="endBtn" onclick="endCall()">끊기</button>

<script>
// 👉 네이버 폼 링크
const formLink = "https://naver.me/G8fZCBl4";

// 👉 영상 리스트
const videos = [
  "https://res.cloudinary.com/dkxltupng/video/upload/f_mp4,q_auto/v1776263765/%EA%B0%95%ED%9D%AC%EC%88%98%EC%84%A0%EC%88%98_o6f2f6.mp4",
  "https://res.cloudinary.com/dkxltupng/video/upload/f_mp4,q_auto/v1776263785/%EA%B9%80%EA%B2%BD%EB%AF%BC%EC%84%A0%EC%88%98_x953oq.mp4",
  "https://res.cloudinary.com/dkxltupng/video/upload/f_mp4,q_auto/v1776263802/%EC%8B%A0%EC%B0%BD%EB%AC%B4%EC%84%A0%EC%88%98_xvabhs.mp4",
  "https://res.cloudinary.com/dkxltupng/video/upload/f_mp4,q_auto/v1776263819/%EC%A0%95%EC%A7%80%ED%9B%88%EC%84%A0%EC%88%98_njviea.mp4",
  "https://res.cloudinary.com/dkxltupng/video/upload/f_mp4,q_auto/v1776263848/%EC%A1%B0%EB%B9%88_dd9b2l.mp4"
];

const video = document.getElementById("video");
const endBtn = document.getElementById("endBtn");

// 🎲 랜덤 선택
const randomVideo = videos[Math.floor(Math.random() * videos.length)];

// ▶️ 시작
function startVideo(){
  document.getElementById("startScreen").style.display = "none";
  video.style.display = "block";

  video.src = randomVideo;

  video.play().catch(() => {
    video.muted = true;
    video.play();
  });

  // ⏱️ 7초 뒤 종료 버튼 등장
  setTimeout(() => {
    endBtn.style.display = "block";
  }, 7000);
}

// 🔴 통화 종료
function endCall(){
  window.location.href = formLink;
}

// 🎬 영상 끝나면 이동
video.addEventListener("ended", () => {
  window.location.href = formLink;
});
</script>

</body>
</html>
